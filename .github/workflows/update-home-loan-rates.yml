name: Update home-loan rates and deploy Pages

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python -m pip install -r requirements.txt
      - name: Run adapter fixture tests
        run: PYTHONPATH=scripts python -m unittest discover -s tests -v
      - name: Collect official rates
        run: python scripts/update_rates.py
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Generate ranking, README, and Pages
        run: python scripts/generate_ranking.py && python scripts/generate_readme.py && python scripts/generate_site.py
      - name: Commit generated data only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data README.md index.html all-lenders.html
          git diff --cached --quiet || git commit -m 'chore: update home-loan rates'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
